<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#bg-gradient)" filter="url(#shadow)"/>

  <!-- Subtle inner glow -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#shine)"/>

  <!-- Code brackets -->
  <g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M200 160 L120 256 L200 352" opacity="0.95"/>
    <!-- Right bracket > -->
    <path d="M312 160 L392 256 L312 352" opacity="0.95"/>
  </g>

  <!-- Center slash / -->
  <line x1="280" y1="140" x2="232" y2="372" stroke="#fff" stroke-width="28" stroke-linecap="round" opacity="0.8"/>

  <!-- Decorative dots -->
  <g fill="#fff" opacity="0.6">
    <circle cx="100" cy="120" r="12"/>
    <circle cx="140" cy="100" r="8"/>
    <circle cx="412" cy="392" r="12"/>
    <circle cx="372" cy="412" r="8"/>
  </g>
</svg>
