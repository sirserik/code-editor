<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Clip path to keep everything inside the rounded rect -->
    <clipPath id="iconClip">
      <rect x="16" y="16" width="480" height="480" rx="90"/>
    </clipPath>
  </defs>

  <!-- Transparent background (no fill = transparent) -->

  <!-- Main rounded square with clipping -->
  <g clip-path="url(#iconClip)">
    <!-- Background -->
    <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#bg-gradient)"/>

    <!-- Subtle inner shine -->
    <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#shine)"/>

    <!-- Code brackets -->
    <g fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left bracket < -->
      <path d="M200 160 L120 256 L200 352"/>
      <!-- Right bracket > -->
      <path d="M312 160 L392 256 L312 352"/>
    </g>

    <!-- Center slash / -->
    <line x1="280" y1="140" x2="232" y2="372" stroke="#fff" stroke-width="28" stroke-linecap="round" opacity="0.85"/>

    <!-- Decorative dots (inside the clipped area) -->
    <g fill="#fff" opacity="0.5">
      <circle cx="100" cy="100" r="10"/>
      <circle cx="130" cy="80" r="6"/>
      <circle cx="412" cy="412" r="10"/>
      <circle cx="382" cy="432" r="6"/>
    </g>
  </g>
</svg>
